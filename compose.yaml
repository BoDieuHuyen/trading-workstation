services:
  trading-workstation:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ${BACKTEST_RESULTS_PATH:-./src/backtest-results}
        target: /usr/share/nginx/html/backtest-results
        read_only: true
        bind:
          create_host_path: false
